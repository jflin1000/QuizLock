plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lin.quizlock'
    compileSdk 34

    defaultConfig {
        applicationId "com.lin.quizlock"
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName "1.1.0"
    }

    // For public builds use the Android debug keystore.
    // To sign a private release, create app/quizlock.keystore and set:
    // QUIZLOCK_STORE_PASSWORD / QUIZLOCK_KEY_PASSWORD / QUIZLOCK_KEY_ALIAS
    def hasReleaseKey = file('quizlock.keystore').exists()
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file('quizlock.keystore')
                storePassword System.getenv('QUIZLOCK_STORE_PASSWORD') ?: ''
                keyAlias System.getenv('QUIZLOCK_KEY_ALIAS') ?: 'quizlock'
                keyPassword System.getenv('QUIZLOCK_KEY_PASSWORD') ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion'
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
